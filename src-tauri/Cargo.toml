[package]
name = "readback-desktop"
version = "0.1.0"
description = "Readback: quiz yourself on your own notes"
authors = ["Readback contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "readback_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "form", "stream", "system-proxy", "charset"] }
tokio = { version = "1.54.1", features = ["macros", "net", "sync", "time", "io-util", "rt-multi-thread"] }
tokio-util = "0.7.20"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
subtle = "2.6.1"
url = "2.5.8"
zeroize = "1.9.1"
tracing = "0.1.44"
futures-util = "0.3.34"
keyring-core = "1.0.1"
uuid = { version = "1.29.0", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = { version = "0.3.55", features = ["parsing"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
